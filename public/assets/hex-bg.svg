<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="gridStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#121219"/>
      <stop offset=".12" stop-color="#19132a"/>
      <stop offset=".25" stop-color="#282071"/>
      <stop offset=".43" stop-color="#1f2e87"/>
      <stop offset=".56" stop-color="#22257d"/>
      <stop offset=".7" stop-color="#482172"/>
      <stop offset=".82" stop-color="#6e267f"/>
      <stop offset="1" stop-color="#17131d"/>
    </linearGradient>
    <radialGradient id="blueGlow">
      <stop offset="0" stop-color="#243cff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#243cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pinkGlow">
      <stop offset="0" stop-color="#ff35dc" stop-opacity=".18"/>
      <stop offset="1" stop-color="#ff35dc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetGlow">
      <stop offset="0" stop-color="#9e35ff" stop-opacity=".16"/>
