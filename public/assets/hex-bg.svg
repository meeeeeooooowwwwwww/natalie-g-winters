    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="hex" width="96" height="83.138" patternUnits="userSpaceOnUse">
      <path d="M24 1 H72 L95 41.569 L72 82.138 H24 L1 41.569 Z" fill="#050506" stroke="url(#gridStroke)" stroke-width="2"/>
