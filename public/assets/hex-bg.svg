    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="#020203"/>
  <ellipse cx="480" cy="480" rx="360" ry="500" fill="url(#blueGlow)"/>
  <ellipse cx="965" cy="480" rx="280" ry="420" fill="url(#blueGlow)" opacity=".7"/>
  <ellipse cx="1375" cy="410" rx="340" ry="520" fill="url(#pinkGlow)"/>
  <ellipse cx="1290" cy="770" rx="300" ry="360" fill="url(#violetGlow)"/>
  <rect width="1920" height="1080" fill="url(#hex)" opacity=".92"/>

