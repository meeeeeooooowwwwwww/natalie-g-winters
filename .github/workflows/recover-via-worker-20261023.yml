name: One-time Natalie worker-bound article recovery deployment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-via-worker-20261023.yml'

permissions:
  contents: read

concurrency:
  group: natalie-production-deployment
  cancel-in-progress: false

jobs:
  deploy-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Require exact Natalie site and Cloudflare destination
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node - <<'NODE'
          const c=JSON.parse(require('fs').readFileSync('wrangler.jsonc','utf8'));
          if(c.name!=='nataliegwinters-site'||c.routes?.length!==1||c.routes[0].pattern!=='nataliegwinters.com'||c.kv_namespaces?.length!==1||c.kv_namespaces[0].id!=='7751d2c212db4316b98316b280882892')throw Error('Worker/site/KV ownership mismatch');
          if(!Array.isArray(c.addresses)||c.addresses.length!==1||c.addresses[0]!=='articles@feeds.nataliegwinters.com')throw Error('Unexpected email routing');
          NODE
      - name: Validate exact Worker before release
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm test
          npx wrangler deploy --dry-run
      - name: Deploy Natalie Worker (uses existing Worker KV permissions)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          npx wrangler deploy --message "Natalie one-time article recovery $GITHUB_SHA"
      - name: Best-effort warm-up of own status endpoint
        run: |
          status=$(curl --silent --show-error --location --max-time 20 -o /tmp/natalie-status.json -w '%{http_code}' https://nataliegwinters-site.generalflynn17.workers.dev/api/status || true)
          if [ "$status" = 200 ]; then
            node -e "const j=require('/tmp/natalie-status.json'); console.log('Worker status articleCount='+j.articleCount+' newest='+j.newestUrl)"
          else
            echo "Worker URL returned HTTP ${status:-unavailable}; do not weaken edge protections. Live status will be checked separately."
          fi
