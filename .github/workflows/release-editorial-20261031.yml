name: Natalie verified editorial release 2026-10-31

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-editorial-20261031.yml'

permissions:
  contents: read

concurrency:
  group: natalie-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify only Natalie production scope and prepare code-only config
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node - <<'NODE'
          const fs = require('node:fs');
          const c = JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          if (c.name !== 'nataliegwinters-site' ||
              c.routes?.length !== 1 ||
              c.routes[0].pattern !== 'nataliegwinters.com' ||
              c.routes[0].custom_domain !== true ||
              c.kv_namespaces?.length !== 1 ||
              c.kv_namespaces[0].id !== '7751d2c212db4316b98316b280882892' ||
              c.addresses?.length !== 1 ||
              c.addresses[0] !== 'articles@feeds.nataliegwinters.com' ||
              c.vars?.NATALIE_EMAIL_RECIPIENT !== c.addresses[0]) {
            throw new Error('Natalie production ownership mismatch; refusing release');
          }
          delete c.addresses; // Explicitly retain all existing manual email routing rules.
          fs.writeFileSync('.wrangler-natalie-editorial-code-only.jsonc', JSON.stringify(c,null,2) + '\n');
          NODE
      - name: Test site, articles, videos and build
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm test
          npx wrangler deploy --config .wrangler-natalie-editorial-code-only.jsonc --dry-run
      - name: Deploy Natalie site without touching Email Routing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          npx wrangler deploy --config .wrangler-natalie-editorial-code-only.jsonc --message "Natalie editorial verified release $GITHUB_SHA"
      - name: Public Worker and source-linked content smoke tests
        run: |
          set -euo pipefail
          origin=""
          for base in https://nataliegwinters.com https://nataliegwinters-site.generalflynn17.workers.dev; do
            code="$(curl --silent --show-error --location --max-time 25 --output "$RUNNER_TEMP/natalie-home.html" --write-out '%{http_code}' "$base/" || true)"
            if [ "$code" = "200" ] && grep -q "Recent Rumble appearance" "$RUNNER_TEMP/natalie-home.html"; then
              origin="$base"
              break
            fi
          done
          test -n "$origin" || { echo "::error::Could not verify newly deployed Natalie homepage"; exit 1; }
          code="$(curl --silent --show-error --location --max-time 25 --output "$RUNNER_TEMP/natalie-videos.html" --write-out '%{http_code}' "$origin/videos")"
          test "$code" = "200"
          grep -q "26 October 2026" "$RUNNER_TEMP/natalie-videos.html"
          grep -q "Best of the Program" "$RUNNER_TEMP/natalie-videos.html" || grep -q "iheart.com" "$RUNNER_TEMP/natalie-videos.html"
          code="$(curl --silent --show-error --location --max-time 25 --output "$RUNNER_TEMP/natalie-status.json" --write-out '%{http_code}' "$origin/api/status")"
          test "$code" = "200"
          node -e "const s=require(process.argv[1]); if(!Number.isInteger(s.articleCount)||s.articleCount<1) throw Error('No live articles'); if(!String(s.newestUrl||'').startsWith('https://nataliegwinters.substack.com/p/')) throw Error('Invalid canonical newest article'); console.log('PASS: '+s.articleCount+' live articles; newest '+s.newestUrl);" "$RUNNER_TEMP/natalie-status.json"
          echo "Natalie only: source-linked homepage/videos and article runtime verified at $origin"
