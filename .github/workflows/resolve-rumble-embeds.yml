name: Resolve Rumble Embed URLs

on:
  push:
    branches:
      - fix/rumble-detail-embeds-2026-09-08
    paths:
      - .github/workflows/resolve-rumble-embeds.yml
      - src/video-data.js

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Resolve all Rumble watch URLs
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { VIDEOS } from './src/video-data.js';

          function normalise(value) {
            return String(value || '')
              .replace(/\\u002F/gi, '/')
              .replace(/\\\//g, '/')
              .replace(/&amp;/g, '&');
          }

          function extractEmbedUrl(value) {
            const source = normalise(value);
            const iframe = source.match(/<iframe[^>]+src=["']([^"']+)["']/i);
            if (iframe?.[1]) return iframe[1];
            const direct = source.match(/https:\/\/rumble\.com\/embed\/(?:ucfsd\.)?[a-z0-9._-]+\/?(?:\?[^\"'<>\s]*)?/i);
            return direct?.[0] || null;
          }

          async function resolve(video) {
            if (video.embedUrl) {
              return { slug: video.slug, rumbleUrl: video.rumbleUrl, embedUrl: video.embedUrl, source: 'existing' };
            }

            const headers = {
              'Accept': 'application/json,text/html;q=0.9,*/*;q=0.8',
              'User-Agent': 'Mozilla/5.0 (compatible; NatalieWintersVideoArchive/2.0; +https://nataliegwinters.com/videos)'
            };

            const endpoint = `https://rumble.com/api/Media/oembed.json?url=${encodeURIComponent(video.rumbleUrl)}`;
            try {
              const response = await fetch(endpoint, { headers });
              if (response.ok) {
                const data = await response.json();
                const embedUrl = extractEmbedUrl(data.html) || data.embedUrl || data.embed_url || null;
                if (embedUrl?.startsWith('https://rumble.com/embed/')) {
                  return { slug: video.slug, rumbleUrl: video.rumbleUrl, embedUrl, source: 'oembed' };
                }
              }
            } catch (error) {
              // Fall back to the watch page.
            }

            try {
              const response = await fetch(video.rumbleUrl, {
                headers: {
                  'Accept': 'text/html,application/xhtml+xml',
                  'User-Agent': headers['User-Agent']
                }
              });
              if (response.ok) {
                const embedUrl = extractEmbedUrl(await response.text());
                if (embedUrl?.startsWith('https://rumble.com/embed/')) {
                  return { slug: video.slug, rumbleUrl: video.rumbleUrl, embedUrl, source: 'watch-page' };
                }
              }
            } catch (error) {
              // Return unresolved below.
            }

            return { slug: video.slug, rumbleUrl: video.rumbleUrl, embedUrl: null, source: 'unresolved' };
          }

          const results = [];
          const concurrency = 4;
          let cursor = 0;

          async function worker() {
            while (cursor < VIDEOS.length) {
              const index = cursor++;
              const result = await resolve(VIDEOS[index]);
              results[index] = result;
              console.log(`${String(index + 1).padStart(2, '0')}/${VIDEOS.length} ${result.slug} ${result.source} ${result.embedUrl || 'UNRESOLVED'}`);
              await new Promise((resolve) => setTimeout(resolve, 150));
            }
          }

          await Promise.all(Array.from({ length: concurrency }, () => worker()));

          fs.writeFileSync('rumble-embed-map.json', JSON.stringify(results, null, 2) + '\n');

          const resolved = results.filter((item) => item.embedUrl).length;
          const unresolved = results.length - resolved;
          console.log(`RUMBLE_EMBED_TOTAL=${results.length}`);
          console.log(`RUMBLE_EMBED_RESOLVED=${resolved}`);
          console.log(`RUMBLE_EMBED_UNRESOLVED=${unresolved}`);
          if (unresolved) process.exitCode = 2;
          NODE

      - name: Upload mapping
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rumble-embed-map
          path: rumble-embed-map.json
          if-no-files-found: error
