name: Read-only Rumble Natalie video discovery
on:
  workflow_dispatch:
  push:
    paths:
      - tools/rumble-discovery.mjs
      - .github/workflows/rumble-discovery.yml
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/rumble-discovery.mjs
      - name: Commit public discovery evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/operations/rumble-discovery-last.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record Rumble read-only discovery evidence'
            git push
          fi
