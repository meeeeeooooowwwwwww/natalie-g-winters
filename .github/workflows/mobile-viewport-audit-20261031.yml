name: Natalie read-only live mobile viewport audit
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - name: Install browser harness and find Chrome
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-audit --no-fund puppeteer-core@24.26.0
          command -v google-chrome || command -v chromium || command -v chromium-browser
      - name: Download live site snapshot for browser-safe layout audit
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/natalie-audit"
          mkdir -p "$root/assets" "$root/articles" "$root/videos"
          origin="https://nataliegwinters-site.generalflynn17.workers.dev"
          curl -fLsS --max-time 30 "$origin/" -o "$root/index.html"
          curl -fLsS --max-time 30 "$origin/articles" -o "$root/articles/index.html"
          curl -fLsS --max-time 30 "$origin/videos" -o "$root/videos/index.html"
          for asset in styles.css theme-magenta.css layout-v2.css footer-icons.css editorial-substack.css rumble-player.js; do
            curl -fLsS --max-time 30 "$origin/assets/$asset" -o "$root/assets/$asset"
          done
          curl -fLsS --max-time 30 "https://hugh.cdn.rumble.cloud/video/fwe2/3d/s8/6/2/O/u/-/2Ou-A.qR4e.jpg" -o "$root/assets/current-rumble.jpg"
          node - "$root/index.html" <<'NODE'
          const fs=require('node:fs');
          const file=process.argv[2], html=fs.readFileSync(file,'utf8');
          fs.writeFileSync(file,html.replaceAll('https://hugh.cdn.rumble.cloud/video/fwe2/3d/s8/6/2/O/u/-/2Ou-A.qR4e.jpg','/assets/current-rumble.jpg'));
          NODE
          echo "Downloaded live site CSS, source HTML and actual Rumble thumbnail"
          (cd "$root" && python3 -m http.server 8765 --bind 127.0.0.1 >"$RUNNER_TEMP/natalie-http.log" 2>&1) &
          sleep 2
          curl -fLsS http://127.0.0.1:8765/ -o /dev/null
      - name: Audit phone widths, images and in-page video controls
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {execSync} from 'node:child_process';
          import puppeteer from 'puppeteer-core';
          const chrome = execSync('command -v google-chrome || command -v chromium || command -v chromium-browser').toString().trim();
          const browser=await puppeteer.launch({executablePath:chrome,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
          try {
            const origin='http://127.0.0.1:8765';
            for(const width of [320,375,390,430,760,768]) {
              const page=await browser.newPage();
              await page.setViewport({width,height:850,isMobile:true,hasTouch:true,deviceScaleFactor:2});
              for(const path of ['/', '/articles','/videos']) {
                const response=await page.goto(origin+path,{waitUntil:'domcontentloaded',timeout:30000});
                assert([200,304].includes(response?.status()),origin+path+' HTTP '+response?.status());
                await page.evaluate(()=>document.fonts.ready);
                const measure=await page.evaluate(()=>{
                  const rect=e=>{const r=e.getBoundingClientRect();return {left:r.left,right:r.right,top:r.top,bottom:r.bottom,width:r.width}};
                  const card=document.querySelector('.article-grid .article-card');
                  const image=card?.querySelector('.article-image');
                  const content=card?.querySelector('.article-content');
                  const side=document.querySelector('.archive-side-card');
                  return {
                    viewport:innerWidth, scroll:document.documentElement.scrollWidth,
                    card:card?rect(card):null,image:image?rect(image):null,copy:content?rect(content):null,
                    side:side?rect(side):null, documentHeight:document.documentElement.scrollHeight
                  };
                });
                console.log('VIEWPORT',width,path,JSON.stringify(measure));
                assert(measure.scroll<=measure.viewport+2,'Horizontal overflow '+width+' '+path+' scroll='+measure.scroll);
                if(width<=760 && path==='/' && measure.image && measure.copy) {
                  assert(measure.image.bottom<=measure.copy.top+3,'Mobile article image and title do not stack');
                  assert(measure.image.width>=measure.card.width-3,'Mobile article image too narrow');
                }
                if(path==='/articles' && measure.side) {
                  assert(measure.side.left>=-2 && measure.side.right<=measure.viewport+2,'Article side card outside viewport');
                }
                if(path==='/') {
                  await page.$eval('.recent-rumble-thumbnail',img=>img.scrollIntoView({block:'center'}));
                  await page.waitForFunction(() => {
                    const img=document.querySelector('.recent-rumble-thumbnail');
                    return img?.complete && img.naturalWidth>0;
                  },{timeout:18000});
                  const thumb=await page.$eval('.recent-rumble-thumbnail',img=>({w:img.naturalWidth,h:img.naturalHeight}));
                  assert(thumb.w>100 && thumb.h>50,'Real Rumble thumbnail did not load');
                  await page.click('button[data-rumble-embed]');
                  const player=await page.$eval('iframe.recent-rumble-frame',x=>x.src);
                  assert.equal(player,'https://rumble.com/embed/v7f9934/');
                  console.log('PLAYER',width,'verified thumbnail',JSON.stringify(thumb),'in-page iframe',player);
                }
              }
              await page.close();
            }
            console.log('PASS: genuine mobile viewports, article cards, Rumble thumbnails and inline player click');
          } finally { await browser.close(); }
          NODE
