name: Verify Natalie Rumble videos (read-only)
on:
  workflow_dispatch:
    inputs:
      pages:
        description: "Rumble channel pages, comma separated, e.g. 2,3"
        required: false
        default: "2,3"
        type: string
  pull_request:
    paths:
      - tools/rumble-collect.mjs
      - .github/workflows/rumble-collect.yml
  push:
    paths:
      - tools/rumble-collect.mjs
      - .github/workflows/rumble-collect.yml
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Collect Rumble metadata without production writes
        env:
          RUMBLE_PAGES: ${{ inputs.pages || '2,3' }}
        run: node tools/rumble-collect.mjs
      - name: Save verified video records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: natalie-rumble-candidates
          path: artifacts/natalie-rumble-candidates.json
          retention-days: 7
          if-no-files-found: warn
