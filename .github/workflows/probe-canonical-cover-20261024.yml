name: Inspect Natalie canonical cover metadata (read only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-canonical-cover-20261024.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read public Substack cover metadata (no secrets)
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, json, re, html, socket
          socket.setdefaulttimeout(11)
          sluglist=[
           "meet-the-american-university-leaders",
           "he-helped-run-immigration-under-biden",
           "blockade-and-riot-how-soros-and-gates"
          ]
          sources=[
            "https://nataliegwinters.substack.com/p/{}",
            "https://r.jina.ai/https://nataliegwinters.substack.com/p/{}",
          ]
          for slug in sluglist:
            for template in sources:
              url=template.format(slug)
              try:
                req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; LinkPreview/1.0)','Accept':'text/html,application/xhtml+xml'})
                with urllib.request.urlopen(req,timeout=10) as rsp:
                  body=rsp.read(1800000).decode('utf-8','replace')
                  print('RESULT',slug,url,'status',rsp.status,'length',len(body))
                  for tag in re.findall(r'<meta\\b[^>]*>',body,re.I):
                    if any(s in tag.lower() for s in ['og:image','twitter:image']):
                      print('COVER-META',slug,html.unescape(tag[:650]))
                  for match in re.findall(r'"(?:cover_image|social_image)"\\s*:\\s*"(https?[^"]+)"',body)[:3]:
                    print('COVER-JSON',slug,match[:450])
              except Exception as e: print('ERROR',slug,url,type(e).__name__,str(e)[:190])
          urls=[
           "https://nataliegwinters.substack.com/api/v1/archive?sort=new&search=&offset=0&limit=10",
           "https://r.jina.ai/http://nataliegwinters.substack.com/api/v1/archive?sort=new&search=&offset=0&limit=10",
           "https://r.jina.ai/https://nataliegwinters.substack.com/api/v1/archive?sort=new&search=&offset=0&limit=10",
          ]
          for url in urls:
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json,text/plain'}),timeout=12) as rsp:
                payload=rsp.read(800000).decode('utf-8','replace')
                print('ARCHIVE-RESULT',url,rsp.status,len(payload),'start:',payload[:150].replace('\\n',' '))
                prefix='Markdown Content:'
                parsed=payload.split(prefix,1)[-1].strip() if prefix in payload else payload
                data=json.loads(parsed)
                for entry in data if isinstance(data,list) else data.get("posts",[]):
                  if any(slug in entry.get("canonical_url","") for slug in sluglist):
                    print('ARCHIVE',entry.get('canonical_url'),{k:entry.get(k) for k in ['id','cover_image','social_image','published_at','post_date']})
            except Exception as e: print('ARCHIVE-ERROR',url,type(e).__name__,str(e)[:190])
          PY
