name: Deploy Natalie G. Winters (independent)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY to release nataliegwinters.com from this repository"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: natalie-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require approved main branch and manual confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$CONFIRM" = "DEPLOY"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact checked-out commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Guard own Cloudflare script and production domain
        run: |
          node -e "const c=JSON.parse(require('node:fs').readFileSync('./wrangler.jsonc','utf8')); if(c.name!=='nataliegwinters-site') throw Error('Wrong Worker'); if(!Array.isArray(c.routes)||c.routes.length!==1||c.routes[0].pattern!=='nataliegwinters.com') throw Error('Unexpected route target');"
      - name: Validate and dry-run exact source
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm test
          npx wrangler deploy --dry-run
      - name: Require Natalie-specific Cloudflare token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "${CLOUDFLARE_API_TOKEN:-}" || {
            echo "::error::CLOUDFLARE_API_TOKEN is not available to natalie-g-winters."
            exit 1
          }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || {
            echo "::error::Configure CLOUDFLARE_ACCOUNT_ID in the natalie-g-winters repository before deploying."
            exit 1
          }
      - name: Deploy Natalie Worker only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --message "Natalie independent release $GITHUB_SHA"
      - name: Check Natalie deployment
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 30 https://nataliegwinters.com/api/status -o "$RUNNER_TEMP/status.json"
          node -e "const f=require('fs');const j=JSON.parse(f.readFileSync(process.argv[1],'utf8'));if(typeof j.articleCount!=='number')throw Error('Missing articleCount in live status');console.log('Natalie status verified')" "$RUNNER_TEMP/status.json"
