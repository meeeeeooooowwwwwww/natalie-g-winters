name: Deploy Natalie G. Winters (independent)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY to release nataliegwinters.com from this repository"
        required: true
        type: string
      manage_email_routing:
        description: "Also reconcile the Natalie email-to-Worker rule (requires Email Routing Rules permission)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: natalie-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require approved main branch and manual confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$CONFIRM" = "DEPLOY"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact checked-out commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Guard own Cloudflare script and production domain
        run: |
          node -e "const c=JSON.parse(require('node:fs').readFileSync('./wrangler.jsonc','utf8')); if(c.name!=='nataliegwinters-site') throw Error('Wrong Worker'); if(!Array.isArray(c.routes)||c.routes.length!==1||c.routes[0].pattern!=='nataliegwinters.com') throw Error('Unexpected route target'); if(!Array.isArray(c.addresses)||c.addresses.length!==1||c.addresses[0]!=='articles@feeds.nataliegwinters.com'||c.vars?.NATALIE_EMAIL_RECIPIENT!==c.addresses[0]) throw Error('Unexpected email route target');"
      - name: Prepare a scoped deployment configuration
        env:
          MANAGE_EMAIL_ROUTING: ${{ inputs.manage_email_routing }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const source = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          if (source.name !== 'nataliegwinters-site' ||
              source.addresses?.length !== 1 ||
              source.addresses[0] !== 'articles@feeds.nataliegwinters.com') {
            throw new Error('Natalie Worker or isolated email route mismatch');
          }
          let configPath = 'wrangler.jsonc';
          if (process.env.MANAGE_EMAIL_ROUTING === 'true') {
            console.log('Explicit Email Routing reconciliation requested; token must have Email Routing Rules permissions.');
          } else {
            delete source.addresses;
            configPath = '.wrangler-natalie-code-only.jsonc';
            fs.writeFileSync(configPath, JSON.stringify(source, null, 2) + '\n');
            console.log('Worker-only deployment: existing Email Routing rules will not be modified.');
          }
          fs.appendFileSync(process.env.GITHUB_ENV, 'NATALIE_DEPLOY_CONFIG=' + configPath + '\n');
          NODE
      - name: Validate and dry-run exact source
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm test
          npx wrangler deploy --config "$NATALIE_DEPLOY_CONFIG" --dry-run
      - name: Require Natalie-specific Cloudflare token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "${CLOUDFLARE_API_TOKEN:-}" || {
            echo "::error::CLOUDFLARE_API_TOKEN is not available to natalie-g-winters."
            exit 1
          }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || {
            echo "::error::Configure CLOUDFLARE_ACCOUNT_ID in the natalie-g-winters repository before deploying."
            exit 1
          }
      - name: Deploy Natalie Worker only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config "$NATALIE_DEPLOY_CONFIG" --message "Natalie independent release $GITHUB_SHA"
      - name: Check Natalie deployment
        run: |
          set -euo pipefail
          primary_url="https://nataliegwinters.com/api/status"
          worker_url="https://nataliegwinters-site.generalflynn17.workers.dev/api/status"
          code="$(curl --silent --show-error --location --max-time 30 --output "$RUNNER_TEMP/status.json" --write-out '%{http_code}' "$primary_url")"
          if [ "$code" = "403" ]; then
            echo "::warning::Natalie custom-domain edge returned HTTP 403 to this GitHub runner; testing the same deployed Worker on workers.dev without weakening zone security."
            code="$(curl --silent --show-error --location --max-time 30 --output "$RUNNER_TEMP/status.json" --write-out '%{http_code}' "$worker_url")"
          fi
          if [ "$code" != "200" ]; then
            echo "::error::Natalie public Worker status check failed: HTTP $code"
            exit 1
          fi
          node -e "const f=require('fs'); const j=JSON.parse(f.readFileSync(process.argv[1],'utf8')); if(typeof j.articleCount!=='number'||j.articleCount<1)throw Error('Missing articles in live status'); if(typeof j.pollingHealth!=='string'||typeof j.emailHealth!=='string')throw Error('Missing ingestion diagnostics'); console.log('Natalie runtime verified; articles='+j.articleCount+'; polling='+j.pollingHealth+'; email='+j.emailHealth); if(j.emailHealth!=='received')console.log('::warning::Natalie email ingestion has not yet been proven with a real notice');" "$RUNNER_TEMP/status.json"
