name: Verify Direct Rumble Embeds

on:
  push:
    branches:
      - fix/rumble-detail-embeds-2026-09-08
    paths:
      - .github/workflows/verify-direct-rumble-embeds.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/rumble-detail-embeds-2026-09-08

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Request every direct Rumble player
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { VIDEOS } from './src/video-data.js';

          const results = [];
          let cursor = 0;
          const concurrency = 4;

          async function check(video) {
            const response = await fetch(video.embedUrl, {
              redirect: 'follow',
              headers: {
                Accept: 'text/html,application/xhtml+xml',
                'User-Agent': 'Mozilla/5.0 (compatible; NatalieWintersVideoArchiveCheck/1.0; +https://nataliegwinters.com/videos)'
              }
            });
            const body = await response.text();
            const ok = response.ok && body.length > 500 && /rumble/i.test(body);
            return {
              slug: video.slug,
              embedUrl: video.embedUrl,
              status: response.status,
              bytes: body.length,
              ok
            };
          }

          async function worker() {
            while (cursor < VIDEOS.length) {
              const index = cursor++;
              try {
                results[index] = await check(VIDEOS[index]);
              } catch (error) {
                results[index] = {
                  slug: VIDEOS[index].slug,
                  embedUrl: VIDEOS[index].embedUrl,
                  status: 0,
                  bytes: 0,
                  ok: false,
                  error: String(error)
                };
              }
              const result = results[index];
              console.log(`${String(index + 1).padStart(2, '0')}/${VIDEOS.length} ${result.slug} status=${result.status} bytes=${result.bytes} ${result.ok ? 'PASS' : 'FAIL'}`);
              await new Promise((resolve) => setTimeout(resolve, 100));
            }
          }

          await Promise.all(Array.from({ length: concurrency }, () => worker()));
          const failed = results.filter((item) => !item.ok);
          console.log(`RUMBLE_PLAYER_TOTAL=${results.length}`);
          console.log(`RUMBLE_PLAYER_PASS=${results.length - failed.length}`);
          console.log(`RUMBLE_PLAYER_FAIL=${failed.length}`);
          if (failed.length) {
            console.error(JSON.stringify(failed, null, 2));
            process.exit(1);
          }
          NODE
