name: CI

on:
  push:
    branches:
      - main
      - seo/**
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Dry-run Cloudflare Worker bundle
        run: npx wrangler deploy --dry-run --outdir /tmp/wrangler-dry-run
