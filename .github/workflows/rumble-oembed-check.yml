name: Read-only Rumble oEmbed validation
on:
  push:
    paths:
      - tools/rumble-oembed-check.mjs
      - .github/workflows/rumble-oembed-check.yml
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/rumble-oembed-check.mjs
      - name: Record publisher response
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/operations/rumble-oembed-check-2026-11-09.json
          git commit -m 'Record official Rumble oEmbed verification' || exit 0
          git push
