name: One-time Natalie verified Rumble players release
on:
  push:
    paths:
      - .github/workflows/one-time-rumble-native-video-release-2026-11-09.yml
permissions:
  actions: write
  contents: write
jobs:
  publish-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Invoke the guarded Worker-only release and verify recent videos
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-production.yml/dispatches"             -f ref=main -f 'inputs[confirm]=DEPLOY' -f 'inputs[manage_email_routing]=false'
          echo "Protected Natalie code-only deployment dispatched"
          run_id=''
          status=''
          conclusion=''
          for attempt in $(seq 1 110); do
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-production.yml/runs?event=workflow_dispatch&per_page=10" >/tmp/runs.json
            matching="$(jq -c --arg started "$started" '[.workflow_runs[] | select(.created_at >= $started)][0] // {}' /tmp/runs.json)"
            run_id="$(printf '%s' "$matching" | jq -r '.id // ""')"
            status="$(printf '%s' "$matching" | jq -r '.status // ""')"
            conclusion="$(printf '%s' "$matching" | jq -r '.conclusion // ""')"
            echo "deploy run=$run_id status=$status conclusion=$conclusion"
            [ "$status" = completed ] && break
            sleep 5
          done
          [ -n "$run_id" ] && [ "$status" = completed ] && [ "$conclusion" = success ]
          code="$(curl --silent --show-error --location --max-time 30 --output /tmp/rumble-videos.html --write-out '%{http_code}' https://nataliegwinters.com/videos || true)"
          checked_domain="nataliegwinters.com"
          if [ "$code" = 403 ]; then
            checked_domain="nataliegwinters-site.generalflynn17.workers.dev"
            code="$(curl --silent --show-error --location --max-time 30 --output /tmp/rumble-videos.html --write-out '%{http_code}' https://nataliegwinters-site.generalflynn17.workers.dev/videos || true)"
          fi
          [ "$code" = 200 ]
          for id in v7fqsp6 v7fqrxc v7fqq8e v7fqpqq v7fonwo; do
            grep -q "$id" /tmp/rumble-videos.html
          done
          grep -q 'hugh.cdn.rumble.cloud/video' /tmp/rumble-videos.html
          grep -q 'data-rumble-embed' /tmp/rumble-videos.html
          home_code="$(curl --silent --show-error --location --max-time 30 --output /tmp/rumble-home.html --write-out '%{http_code}' "https://${checked_domain}/" || true)"
          [ "$home_code" = 200 ] && grep -q 'v7fqsp6' /tmp/rumble-home.html
          mkdir -p docs/operations
          jq -n --arg run "$run_id" --arg conclusion "$conclusion" --arg domain "$checked_domain" --arg videoHttp "$code" --arg homeHttp "$home_code" '{date:"2026-11-09",sourcePr:50,productionRun:$run,conclusion:$conclusion,verifiedDomain:$domain,videoHttp:$videoHttp,homeHttp:$homeHttp,verifiedEmbedIds:["v7fqsp6","v7fqrxc","v7fqq8e","v7fqpqq","v7fonwo"],thumbnailPresent:true,rumblePlayerBindingPresent:true,emailRoutingChanges:false}' > docs/operations/rumble-release-2026-11-09.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/operations/rumble-release-2026-11-09.json
          git commit -m 'Record deployed Natalie native Rumble video verification'
          git push
          echo "Protected Natalie release and page checks passed"
