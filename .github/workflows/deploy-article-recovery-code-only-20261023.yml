name: Natalie official Substack cover images code-only deployment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-article-recovery-code-only-20261023.yml'

permissions:
  contents: read

concurrency:
  group: natalie-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Validate exact site and build code-only deployment config
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node - <<'NODE'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          if(c.name!=='nataliegwinters-site'||c.routes?.length!==1||c.routes[0].pattern!=='nataliegwinters.com'||c.kv_namespaces?.length!==1||c.kv_namespaces[0].id!=='7751d2c212db4316b98316b280882892'||c.addresses?.length!==1||c.addresses[0]!=='articles@feeds.nataliegwinters.com') throw Error('Natalie site/routing/KV scope mismatch');
          delete c.addresses;
          fs.writeFileSync('.wrangler-natalie-recovery-code-only.jsonc',JSON.stringify(c,null,2));
          console.log('Code-only config created. Existing Email Routing rule is manually managed and not modified.');
          NODE
      - name: Check site code and recovery tests
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm test
          npx wrangler deploy --config .wrangler-natalie-recovery-code-only.jsonc --dry-run
      - name: Deploy code only, retaining manual email route
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          npx wrangler deploy --config .wrangler-natalie-recovery-code-only.jsonc --message "Natalie verified-article recovery $GITHUB_SHA"
      - name: Trigger Worker status read and bounded recovery
        run: |
          set -euo pipefail
          for domain in "https://nataliegwinters-site.generalflynn17.workers.dev/api/status" "https://nataliegwinters.com/api/status"; do
            status=$(curl --silent --show-error --location --max-time 20 -o /tmp/natalie-status.json -w '%{http_code}' "$domain" || true)
            if [ "$status" = 200 ]; then
              node - <<'NODE'
          const j=require('/tmp/natalie-status.json');
          console.log('Live Worker status:',JSON.stringify({articleCount:j.articleCount,newestTitle:j.newestTitle,newestUrl:j.newestUrl,pollingHealth:j.pollingHealth,emailHealth:j.emailHealth,pendingCoverCount:j.pendingCoverCount}));
          if (j.articleCount < 25 || !String(j.newestUrl||'').startsWith('https://nataliegwinters.substack.com/p/')) process.exitCode=2;
          NODE
              base="${domain%/api/status}"
              for page in / /articles; do
                response_code="$(curl --silent --show-error --location --max-time 20 -o /tmp/natalie-article-page.html -w '%{http_code}' "${base}${page}" || true)"
                if [ "$response_code" != 200 ]; then
                  echo "::error::Natalie ${page} image verification failed: HTTP ${response_code}"
                  exit 1
                fi
                image_paths="$(node - <<'NODE'
          const fs=require('node:fs');
          const html=fs.readFileSync('/tmp/natalie-article-page.html','utf8');
          const found=[...html.matchAll(/src="([^"]+)"/g)]
            .map(match=>match[1]).filter(path=>path.startsWith('/media/substack/'));
          for (const [date,coverFile] of [
            ['Oct 23','7e4aba5f-56b5-4c97-a8d9-9a69847a3955_1672x941.png'],
            ['Oct 22','cd2d18ee-2ab8-461b-971f-ca39d16374ca_700x467.jpeg'],
            ['Oct 21','c098b97a-820a-4f7d-8173-2da9bebae208_1260x859.jpeg'],
          ]) {
            const path=found.find(value=>value.endsWith('/'+coverFile));
            if(!path) throw new Error('Missing verified Substack archive cover for '+date);
            console.log(path);
          }
          NODE
                )" || { echo "::error::One or more verified archive cover images missing on ${page}"; exit 1; }
                while IFS= read -r image_path; do
                  [ -n "$image_path" ] || continue
                  image_code="$(curl --silent --show-error --location --max-time 20 -o /tmp/natalie-article-image -w '%{http_code}' "${base}${image_path}" || true)"
                  if [ "$image_code" != 200 ] || [ ! -s /tmp/natalie-article-image ]; then
                    echo "::error::Official cover image unavailable on ${page}: HTTP ${image_code}; path=${image_path}"
                    exit 1
                  fi
                  echo "Verified official Substack cover on ${page}: ${image_path}"
                done <<< "$image_paths"
              done
              exit 0
            fi
            echo "Cannot read $domain from GitHub runner (HTTP ${status:-unavailable}); this does not indicate an application error."
          done
          echo 'Worker deployed. External edge denies automated verification; inspect live /api/status in browser.'
