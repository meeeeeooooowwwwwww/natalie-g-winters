name: Persist Rumble Embed URLs

on:
  push:
    branches:
      - fix/rumble-detail-embeds-2026-09-08
    paths:
      - .github/workflows/persist-rumble-embeds.yml

permissions:
  contents: write

jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/rumble-detail-embeds-2026-09-08
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Resolve and persist direct embed URLs
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { VIDEOS } from './src/video-data.js';

          function normalise(value) {
            return String(value || '')
              .replace(/\\u002F/gi, '/')
              .replace(/\\\//g, '/')
              .replace(/&amp;/g, '&');
          }

          function extractEmbedUrl(value) {
            const source = normalise(value);
            const iframe = source.match(/<iframe[^>]+src=["']([^"']+)["']/i);
            if (iframe?.[1]) return iframe[1];
            const direct = source.match(/https:\/\/rumble\.com\/embed\/(?:ucfsd\.)?[a-z0-9._-]+\/?(?:\?[^\"'<>\s]*)?/i);
            return direct?.[0] || null;
          }

          async function resolve(video) {
            if (video.embedUrl) return video.embedUrl;
            const endpoint = `https://rumble.com/api/Media/oembed.json?url=${encodeURIComponent(video.rumbleUrl)}`;
            const response = await fetch(endpoint, {
              headers: {
                Accept: 'application/json',
                'User-Agent': 'Mozilla/5.0 (compatible; NatalieWintersVideoArchive/2.0; +https://nataliegwinters.com/videos)'
              }
            });
            if (!response.ok) throw new Error(`${video.slug}: oEmbed returned ${response.status}`);
            const data = await response.json();
            const embedUrl = extractEmbedUrl(data.html) || data.embedUrl || data.embed_url || null;
            if (!embedUrl?.startsWith('https://rumble.com/embed/')) throw new Error(`${video.slug}: no direct Rumble embed URL`);
            return embedUrl;
          }

          const resolved = new Map();
          for (const video of VIDEOS) {
            resolved.set(video.rumbleUrl, await resolve(video));
          }

          let source = fs.readFileSync('src/video-data.js', 'utf8');
          let inserted = 0;

          for (const video of VIDEOS) {
            if (video.embedUrl) continue;
            const embedUrl = resolved.get(video.rumbleUrl);
            const marker = `    rumbleUrl: ${JSON.stringify(video.rumbleUrl)},`;
            const replacement = `${marker}\n    embedUrl: ${JSON.stringify(embedUrl)},`;
            if (!source.includes(marker)) throw new Error(`${video.slug}: rumbleUrl marker not found in source`);
            source = source.replace(marker, replacement);
            inserted += 1;
          }

          fs.writeFileSync('src/video-data.js', source);
          console.log(`RUMBLE_EMBED_URLS_INSERTED=${inserted}`);
          console.log(`RUMBLE_VIDEO_TOTAL=${VIDEOS.length}`);
          NODE

      - name: Verify persisted data
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const mod = await import(`./src/video-data.js?verify=${Date.now()}`);
          const missing = mod.VIDEOS.filter((video) => !video.embedUrl || !video.embedUrl.startsWith('https://rumble.com/embed/'));
          console.log(`RUMBLE_VIDEO_TOTAL=${mod.VIDEOS.length}`);
          console.log(`RUMBLE_EMBED_MISSING=${missing.length}`);
          if (missing.length) {
            console.error(missing.map((video) => video.slug).join('\n'));
            process.exit(1);
          }
          NODE

      - name: Commit resolved embed URLs
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/video-data.js; then
            echo "No embed URL changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/video-data.js
          git commit -m "Persist direct Rumble embed URLs"
          git push origin HEAD:fix/rumble-detail-embeds-2026-09-08
