name: One-time Natalie Substack article backlog recovery 2026-10-23

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-substack-articles-20261023.yml'

permissions:
  contents: read

concurrency:
  group: natalie-backfill-20261023
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify exact Natalie-only recovery scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          node - <<'NODE'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          if(c.name!=='nataliegwinters-site'||c.kv_namespaces?.length!==1||c.kv_namespaces[0].id!=='7751d2c212db4316b98316b280882892') throw Error('Wrong Worker or production KV');
          NODE
      - name: Install pinned dependencies and test one-time plan
        run: |
          npm ci --no-audit --no-fund
          node test/substack-backfill.test.mjs
      - name: Recover two genuine publication posts without disturbing history
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NATALIE_BACKFILL_APPROVED: two-email-posts-20261023
        run: node scripts/operations/backfill-substack-20261023.mjs
