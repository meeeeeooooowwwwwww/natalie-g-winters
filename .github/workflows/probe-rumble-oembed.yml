name: Natalie Rumble oEmbed metadata source check
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Rumble native oEmbed endpoints
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,json
          urls=[
          'https://rumble.com/v7hfm0m-winters.html',
          'https://rumble.com/v7hcxyw-natalie-winters-inside-the-neocons-secret-plan-to-take-the-republican-party.html',
          'https://rumble.com/v7hbz26-natalie-winters-the-political-warfare-of-democrats-vow-to-go-after-trump.html',
          'https://rumble.com/v7hape6-natalie.html',
          'https://rumble.com/v7hapky-natalie-winters-inside-the-neocons-secret-plan-to-take-the-republican-party.html']
          endpoints=['https://wn0.rumble.com/api/Media/oembed.json?url=','https://rumble.com/api/Media/oembed.json?url=']
          for url in urls:
            for prefix in endpoints:
              target=prefix+urllib.parse.quote(url,safe='')
              try:
                req=urllib.request.Request(target,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'})
                with urllib.request.urlopen(req,timeout=9) as resp:
                  data=json.loads(resp.read(40000))
                  print('OK',url,prefix,'embed',data.get('html'),'thumb',data.get('thumbnail_url'),'title',data.get('title'),flush=True)
                  break
              except Exception as e:print('ERROR',url,prefix,type(e).__name__,str(e)[:110],flush=True)
          PY
