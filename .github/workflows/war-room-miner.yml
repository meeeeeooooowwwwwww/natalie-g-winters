name: War Room weekly miner
on:
  schedule:
    - cron: '0 19 * * 4'
  workflow_dispatch:
  push:
    branches: [seo/war-room-weekly-20261015]
    paths: [.github/workflows/war-room-miner.yml, scripts/mine-war-room.py]
permissions:
  contents: write
concurrency:
  group: war-room-miner
  cancel-in-progress: false
jobs:
  mine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check incremental miner
        run: python3 test/war-room-miner.test.py
      - name: Mine new Natalie Winters videos
        run: python3 scripts/mine-war-room.py --max-pages 100
      - name: Persist discoveries and checkpoint together
        run: |
          if git diff --quiet -- data/war-room-miner.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/war-room-miner.json
          git commit -m 'Record new War Room videos and successful scan checkpoint'
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: war-room-miner-state
          path: data/war-room-miner.json
          retention-days: 7
